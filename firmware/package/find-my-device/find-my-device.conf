# Shell configuration read by /usr/bin/find-my-device-start.
FMD_INTERFACE=eth0
FMD_HTTP_PORT=8080
FMD_DEVICE_NAME='My Finder'
FMD_DEVICE_MODEL=FINDER-R01
# "auto" prefers CY15B256Q FRAM, 24LC16B EEPROM, raw SPI-NOR, then mounted
# SD-card, SPI-NOR, and SPI-NAND storage, and finally the RAM-backed root
# filesystem.
FMD_STATE_FILE=auto
# "auto" discovers the AT25 driver's writable FRAM sysfs file.
FMD_FRAM_STATE_DEVICE=auto
FMD_FRAM_WAIT=3
# "auto" discovers the at24 NVMEM device labelled "find-my-device-eeprom".
FMD_EEPROM_STATE_DEVICE=auto
FMD_EEPROM_WAIT=3
# "auto" discovers the MTD partition labelled "find-my-device-state".
FMD_SPINOR_RAW_DEVICE=auto
FMD_SPINOR_RAW_WAIT=3
FMD_SDCARD_STATE_FILE=/mnt/sdcard/find-my-device/state
FMD_SDCARD_WAIT=10
FMD_SPINOR_STATE_FILE=/mnt/spinor/find-my-device/state
FMD_SPINOR_WAIT=10
FMD_SPINAND_STATE_FILE=/mnt/spinand/find-my-device/state
FMD_SPINAND_WAIT=10

# The STM32F429I-DISC1 blue USER button is PA0 and active-high.
FMD_BUTTON_CHIP=/dev/gpiochip0
FMD_BUTTON_LINE=0
FMD_BUTTON_ACTIVE_LOW=no
# The on-board green LED is PG13 and active-high.
FMD_LED_CHIP=/dev/gpiochip6
FMD_LED_LINE=13
FMD_GPIO_ENABLED=yes
