# Shell configuration read by /usr/bin/find-my-device-start.
FMD_INTERFACE=eth0
FMD_HTTP_PORT=8080
FMD_DEVICE_NAME='My Finder'
FMD_DEVICE_MODEL=FINDER-R01
FMD_STATE_FILE=/var/lib/find-my-device/state

# The STM32F429I-DISC1 blue USER button is PA0 and active-high.
FMD_BUTTON_CHIP=/dev/gpiochip0
FMD_BUTTON_LINE=0
FMD_BUTTON_ACTIVE_LOW=no
# The on-board green LED is PG13 and active-high.
FMD_LED_CHIP=/dev/gpiochip6
FMD_LED_LINE=13
FMD_GPIO_ENABLED=yes
